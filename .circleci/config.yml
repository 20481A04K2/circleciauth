version: 2.1

executors:
  gcloud:
    docker:
      - image: google/cloud-sdk:slim
    environment:
      GOOGLE_CLOUD_PROJECT: sylvan-hydra-464904-d9
      WORKLOAD_IDENTITY_PROVIDER: projects/57920515119/locations/global/workloadIdentityPools/circleci-oidc/providers/github
      SERVICE_ACCOUNT_EMAIL: circleci-oidc@sylvan-hydra-464904-d9.iam.gserviceaccount.com

jobs:
  deploy:
    executor: gcloud
    steps:
      - checkout

      - run:
          name: Authenticate to Google Cloud
          command: |
            gcloud auth login --brief || true
            gcloud auth list

            gcloud iam workload-identity-pools create-cred-config \
              "${WORKLOAD_IDENTITY_PROVIDER}" \
              --service-account="${SERVICE_ACCOUNT_EMAIL}" \
              --output-file=creds.json \
              --credential-source-file="${HOME}/.config/gcloud/legacy_credentials/$(gcloud config get-value account)/adc.json"

            gcloud auth login --cred-file=creds.json
            gcloud auth activate-service-account --key-file=creds.json
            gcloud config set project $GOOGLE_CLOUD_PROJECT

      - run:
          name: Deploy / Your Custom Command
          command: |
            echo "Authenticated! Running gcloud command..."
            gcloud compute instances list
