version: 2.1

executors:
  default:
    docker:
      - image: google/cloud-sdk:slim

jobs:
  deploy:
    executor: default
    steps:
      - checkout

      - run:
          name: Authenticate to Google Cloud using Workload Identity Federation
          command: |
            export GOOGLE_WORKLOAD_IDENTITY_PROVIDER="projects/57920515119/locations/global/workloadIdentityPools/circleci-identity-pool/providers/github"
            export GOOGLE_SERVICE_ACCOUNT="circleci-deploy-sa@sylvan-hydra-464904-d9.iam.gserviceaccount.com"

            gcloud auth login --brief || {
              echo "❌ Authentication failed."
              exit 1
            }

            gcloud auth workload-identity-federation configure \
              --workload-identity-provider="$GOOGLE_WORKLOAD_IDENTITY_PROVIDER" \
              --service-account="$GOOGLE_SERVICE_ACCOUNT" \
              --quiet

            gcloud config set account "$GOOGLE_SERVICE_ACCOUNT"

            TOKEN=$(gcloud auth print-identity-token)
            if [ -n "$TOKEN" ]; then
              echo "✅ Authenticated successfully with WIF"
            else
              echo "❌ Failed to retrieve identity token"
              exit 1
            }

workflows:
  deploy_to_gcp:
    jobs:
      - deploy
