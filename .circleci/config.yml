version: 2.1

jobs:
  authenticate:
    docker:
      - image: google/cloud-sdk:latest
    steps:
      - checkout
      - run:
          name: Authenticate to GCP using Workload Identity Federation
          command: |
            echo "🔐 Starting GCP authentication with WIF..."

            # === Hardcoded values ===
            WORKLOAD_IDENTITY_PROVIDER="projects/57920515119/locations/global/workloadIdentityPools/circleci-identity-pool/providers/github"
            SERVICE_ACCOUNT_EMAIL="circleci-deploy-sa@sylvan-hydra-464904-d9.iam.gserviceaccount.com"
            OIDC_TOKEN_FILE="/tmp/oidc-token"
            OUTPUT_CREDENTIAL_FILE="/tmp/generated-wif-credentials.json"

            # === Save CircleCI OIDC token to a file ===
            echo "$CIRCLE_OIDC_TOKEN" > "$OIDC_TOKEN_FILE"

            # === Create credential config file for GCP ===
            gcloud iam workload-identity-pools create-cred-config \
              "$WORKLOAD_IDENTITY_PROVIDER" \
              --service-account="$SERVICE_ACCOUNT_EMAIL" \
              --output-file="$OUTPUT_CREDENTIAL_FILE" \
              --credential-source-file="$OIDC_TOKEN_FILE" \
              --credential-source-type=text

            # === Authenticate using generated credential config ===
            gcloud auth login --cred-file="$OUTPUT_CREDENTIAL_FILE" --brief

            # === Test authentication ===
            ACCESS_TOKEN=$(gcloud auth print-access-token 2>/dev/null)

            if [ -n "$ACCESS_TOKEN" ]; then
              echo "✅ Authenticated successfully to GCP with WIF!"
            else
              echo "❌ Authentication failed. No access token returned."
              exit 1
            fi

workflows:
  wif-auth-flow:
    jobs:
      - authenticate:
          context: gcp-wif
