version: 2.1

executors:
  gcloud:
    docker:
      - image: google/cloud-sdk:slim
    environment:
      GOOGLE_CLOUD_PROJECT: sylvan-hydra-464904-d9
      WORKLOAD_IDENTITY_PROVIDER: projects/57920515119/locations/global/workloadIdentityPools/circleci-oidc/providers/github
      SERVICE_ACCOUNT_EMAIL: circleci-oidc@sylvan-hydra-464904-d9.iam.gserviceaccount.com

jobs:
  deploy:
    executor: gcloud
    steps:
      - checkout

      - run:
          name: Fetch ID token and authenticate to GCP
          command: |
            # Fetch OIDC token from CircleCI's internal metadata endpoint
            ID_TOKEN=$(curl -s -f --request GET \
              --url http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/identity \
              -H "Metadata-Flavor: Google" || true)

            if [ -z "$ID_TOKEN" ]; then
              echo "Could not fetch identity token from CircleCI."
              exit 1
            fi

            # Login to gcloud using Workload Identity Federation
            gcloud auth login \
              --brief \
              --cred-file=<( \
                gcloud iam workload-identity-pools create-cred-config \
                  "$WORKLOAD_IDENTITY_PROVIDER" \
                  --service-account="$SERVICE_ACCOUNT_EMAIL" \
                  --output-file=- \
                  --credential-source-url="http://metadata/identity/oauth2/token" \
                  --credential-source-headers="Metadata-Flavor: Google" \
                  --credential-source-type=metadata \
                  --subject-token-type="urn:ietf:params:oauth:token-type:id_token"
              )

            gcloud config set project $GOOGLE_CLOUD_PROJECT

      - run:
          name: Run gcloud command
          command: |
            echo "Authenticated! Listing GCE instances..."
            gcloud compute instances list

workflows:
  version: 2
  deploy_on_main:
    jobs:
      - deploy
