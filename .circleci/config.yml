version: 2.1

jobs:
  deploy-to-gcp:
    docker:
      - image: google/cloud-sdk:latest

    steps:
      - checkout

      - run:
          name: Authenticate to Google Cloud with Workload Identity Federation
          command: |
            gcloud auth login --brief
            gcloud auth print-identity-token

      - run:
          name: Set up Workload Identity Federation credentials
          command: |
            gcloud iam workload-identity-pools create-cred-config \
              projects/57920515119/locations/global/workloadIdentityPools/circleci-identity-pool/providers/github \
              --service-account=circleci-deploy-sa@sylvan-hydra-464904-d9.iam.gserviceaccount.com \
              --output-file=creds.json

      - run:
          name: Authenticate with GCP using WIF
          command: |
            gcloud auth login --cred-file=creds.json
            gcloud auth activate-service-account \
              --key-file=creds.json
            gcloud config set project sylvan-hydra-464904-d9

      - run:
          name: Example gcloud command
          command: |
            gcloud info
            gcloud config list

workflows:
  deploy:
    jobs:
      - deploy-to-gcp
