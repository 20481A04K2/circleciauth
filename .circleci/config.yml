version: 2.1

jobs:
  authenticate:
    docker:
      - image: google/cloud-sdk:latest
    steps:
      - checkout

      - run:
          name: Authenticate to Google Cloud using Workload Identity Federation
          command: |
            # Hardcoded variables
            GOOGLE_WORKLOAD_IDENTITY_PROVIDER="projects/57920515119/locations/global/workloadIdentityPools/circleci-identity-pool/providers/github"
            GOOGLE_SERVICE_ACCOUNT="circleci-deploy-sa@sylvan-hydra-464904-d9.iam.gserviceaccount.com"

            # Authenticate to GCP using WIF
            gcloud auth workload-identity-federation configure \
              --workload-identity-provider="$GOOGLE_WORKLOAD_IDENTITY_PROVIDER" \
              --service-account="$GOOGLE_SERVICE_ACCOUNT" \
              --quiet

            # Set the service account as the current account
            gcloud config set account "$GOOGLE_SERVICE_ACCOUNT"

            # Validate authentication
            TOKEN=$(gcloud auth print-identity-token)
            if [ -n "$TOKEN" ]; then
              echo "✅ Authenticated successfully with WIF"
            else
              echo "❌ Failed to retrieve identity token"
              exit 1
            }

workflows:
  authenticate-workflow:
    jobs:
      - authenticate
